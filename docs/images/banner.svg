<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161c"/>
      <stop offset="1" stop-color="#262a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>

  <!-- Tarjeta de silueta, como el overlay del viewport -->
  <g transform="translate(860 50)">
    <rect width="300" height="260" rx="14" fill="#000" stroke="#ffffff" stroke-opacity="0.15"/>
    <g fill="url(#accent)">
      <ellipse cx="150" cy="115" rx="72" ry="58"/>
      <ellipse cx="72" cy="100" rx="34" ry="24"/>
      <ellipse cx="228" cy="100" rx="34" ry="24"/>
      <rect x="122" y="140" width="56" height="80" rx="26"/>
    </g>
    <text x="16" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffb347">FRONT</text>
    <g transform="translate(110 -26)">
      <circle cx="0" cy="0" r="13" fill="#4f622f"/>
      <circle cx="40" cy="0" r="13" fill="#6b3b41"/>
      <circle cx="80" cy="0" r="13" fill="#38506b"/>
    </g>
  </g>

  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">Silhouette</text>
  <rect x="84" y="176" width="140" height="6" rx="3" fill="url(#accent)"/>
  <text x="82" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#c9cdd6">See your model's silhouette while you work.</text>
  <text x="82" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#8a909c">Add-on for Blender 5.3+ · v2.2.0 · GPLv3</text>
</svg>
